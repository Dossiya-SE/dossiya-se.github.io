---
layout: default
---
<article class="research-document">
  <p class="research-kicker">Stage {{ page.stage }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.question %}<p class="research-lede"><strong>Research question:</strong> {{ page.question }}</p>{% endif %}
  {% if page.status %}<p class="status-line">Status: <strong>{{ page.status }}</strong></p>{% endif %}
  {{ content }}
</article>
