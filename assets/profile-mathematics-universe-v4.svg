<text x="72" y="696" class="fg" font-size="20" font-weight="700">[S] source mathematics</text>
<text x="72" y="732" class="fg math" font-size="20">gαβ = ∂αr · ∂βr</text>
<text x="72" y="764" class="fg math" font-size="20">d²uᵅ/ds² + Γᵅβγ (duᵝ/ds)(duᵞ/ds) = 0</text>
