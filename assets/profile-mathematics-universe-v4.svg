<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Profile-wide mathematics universe</title>
<desc id="desc">Editorial mathematical field connecting foundations, dynamics, networks, inference, uncertainty, viability, control, and a bounded differential-geometry research-transfer bridge. Curves indicate conceptual or computational relations, not causal evidence.</desc>
<style>
:root{--bg:#fff;--fg:#0c1711;--muted:#536159;--line:#dce6df;--green:#1f7a40;--green2:#66b77a;--blue:#2d5bd1;--violet:#7b3fc6;--amber:#a66508;--hyp:#b42b6d}
@media (prefers-color-scheme:dark){:root{--bg:#061009;--fg:#edf7f0;--muted:#a6b7ac;--line:#1d3424;--green:#68cd7f;--green2:#9be3aa;--blue:#7da6ff;--violet:#c99cff;--amber:#f0bd62;--hyp:#f08bb9}}
.bg{fill:var(--bg)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.hair{stroke:var(--line);fill:none}.g{stroke:var(--green);fill:none}.g2{stroke:var(--green2);fill:none}.b{stroke:var(--blue);fill:none}.v{stroke:var(--violet);fill:none}.a{stroke:var(--amber);fill:none}.h{stroke:var(--hyp);fill:none;stroke-dasharray:8 7}.dotg{fill:var(--green)}.dotb{fill:var(--blue)}.dotv{fill:var(--violet)}.dota{fill:var(--amber)}.doth{fill:var(--hyp)}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}.serif{font-family:Georgia,'Times New Roman',serif}
</style>
