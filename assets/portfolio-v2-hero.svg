<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="title desc">
  <title id="title">Power and transportation infrastructure connected to mathematical state-space reasoning</title>
  <desc id="desc">A restrained engineering and mathematics visualization showing coupled power and transportation networks, causal interfaces, a mathematical state-space trajectory, a viability boundary, and an engineering intervention.</desc>
  <style>
    :root{--bg:#fffdfa;--ink:#0d1117;--muted:#57606a;--line:#d8d3c8;--gold:#9a6700;--blue:#2f6fda;--soft:#f0eee7}
    @media(prefers-color-scheme:dark){:root{--bg:#111820;--ink:#f0f3f6;--muted:#9ba5b0;--line:#30363d;--gold:#d2a63c;--blue:#72a7ff;--soft:#161d26}}
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
    .muted{fill:var(--muted)} .gold{fill:var(--gold)} .blue{fill:var(--blue)}
    .label{font-size:14px;font-weight:800;letter-spacing:.12em} .small{font-size:13px}.math{font-family:Georgia,"Times New Roman",serif;font-size:19px}
  </style>
  <rect x="1" y="1" width="898" height="688" rx="28" fill="var(--bg)" stroke="var(--line)"/>
  <text x="48" y="54" class="label gold">PHYSICAL REALITY</text>
  <text x="48" y="82" class="small muted">Coupled infrastructure before abstraction</text>

  <g transform="translate(54 132)">
    <text x="0" y="0" class="label">POWER</text>
    <g stroke="var(--ink)" stroke-width="2" fill="var(--bg)">
      <line x1="10" y1="44" x2="112" y2="20"/><line x1="112" y1="20" x2="210" y2="62"/><line x1="112" y1="20" x2="122" y2="110"/><line x1="122" y1="110" x2="224" y2="120"/><line x1="210" y1="62" x2="224" y2="120"/>
      <circle cx="10" cy="44" r="9"/><circle cx="112" cy="20" r="9"/><circle cx="210" cy="62" r="9"/><circle cx="122" cy="110" r="9"/><circle cx="224" cy="120" r="9"/>
    </g>
    <path d="M20 44H101" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="152" class="small muted">generation · grid · charging supply</text>
  </g>

  <g transform="translate(54 390)">
    <text x="0" y="0" class="label">TRANSPORTATION</text>
    <g stroke="var(--ink)" stroke-width="2" fill="var(--bg)">
      <path d="M8 54 C65 4 142 7 215 48 S328 112 390 74" fill="none"/>
      <path d="M18 104 C110 145 198 111 284 130 S378 158 424 124" fill="none"/>
      <circle cx="8" cy="54" r="8"/><circle cx="124" cy="26" r="8"/><circle cx="215" cy="48" r="8"/><circle cx="284" cy="130" r="8"/><circle cx="390" cy="74" r="8"/><circle cx="424" cy="124" r="8"/>
    </g>
    <text x="0" y="177" class="small muted">roads · mobility demand · charging access</text>
  </g>

  <g transform="translate(348 170)">
    <path d="M0 14C50 14 55 128 0 128" fill="none" stroke="var(--gold)" stroke-width="2.6"/>
    <path d="M0 128C-50 128 -55 14 0 14" fill="none" stroke="var(--gold)" stroke-width="2.6"/>
    <circle cx="0" cy="71" r="12" fill="var(--gold)"/>
    <text x="34" y="51" class="small gold">causal interfaces</text>
    <text x="34" y="73" class="math gold">I<tspan dy="5" font-size="12">ij</tspan><tspan dy="-5"> </tspan></text>
    <text x="34" y="99" class="small muted">direction · delay · mechanism</text>
  </g>

  <line x1="472" y1="110" x2="472" y2="594" stroke="var(--line)"/>

  <g transform="translate(525 96)">
    <text x="0" y="0" class="label blue">MATHEMATICAL STRUCTURE</text>
    <text x="0" y="28" class="small muted">State space constrained by the engineering system</text>

    <path d="M38 160 C94 84 205 78 278 136 C338 184 335 293 260 337 C176 386 68 342 35 260 C14 208 15 191 38 160Z" fill="var(--soft)" stroke="var(--blue)" stroke-width="2.2"/>
    <path d="M90 292 C123 254 143 216 166 198 C196 174 223 185 233 213 C242 239 225 264 198 270 C169 277 148 256 154 233" fill="none" stroke="var(--blue)" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="90" cy="292" r="7" fill="var(--blue)"/>
    <circle cx="154" cy="233" r="7" fill="var(--gold)"/>
    <line x1="154" y1="233" x2="62" y2="192" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="20" y="184" class="math gold">ρ<tspan dy="5" font-size="12">g</tspan></text>
    <text x="248" y="122" class="math blue">∂V</text>
    <text x="110" y="328" class="math">Y(t)</text>
    <text x="236" y="332" class="small muted">viable region</text>

    <g transform="translate(0 408)">
      <text x="0" y="0" class="label gold">ENGINEERING DECISION</text>
      <rect x="0" y="25" width="300" height="88" rx="15" fill="var(--soft)" stroke="var(--line)"/>
      <text x="24" y="58" class="math">u<tspan dy="-6" font-size="12">★</tspan></text>
      <text x="70" y="56" class="small">intervene · restore · control</text>
      <text x="70" y="82" class="small muted">subject to physics, uncertainty and evidence</text>
    </g>
  </g>

  <text x="48" y="650" class="small muted">Physical meaning constrains mathematical representation; mathematical structure supports engineering reasoning.</text>
</svg>
