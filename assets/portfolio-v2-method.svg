<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Physics-grounded mathematical engineering method</title>
  <desc id="desc">Five-stage method from physical reality through causal mechanisms and mathematical structure to uncertainty-aware engineering decisions.</desc>
  <style>
    :root{--bg:#fffdfa;--ink:#0d1117;--muted:#57606a;--line:#d8d3c8;--accent:#87CEFA;--accent-stroke:#2D8FD6;--accent-text:#2878CD;--blue:#2f6fda;--soft:#f0eee7}
    @media(prefers-color-scheme:dark){:root{--bg:#111820;--ink:#f0f3f6;--muted:#9ba5b0;--line:#30363d;--accent:#87CEFA;--accent-stroke:#87CEFA;--accent-text:#BFE8FF;--blue:#72a7ff;--soft:#161d26}}
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
    .muted{fill:var(--muted)} .accent{fill:var(--accent-text)} .blue{fill:var(--blue)} .head{font-size:16px;font-weight:850}.small{font-size:12px}.math{font-family:Georgia,"Times New Roman",serif;font-size:19px}
  </style>
  <rect x="1" y="1" width="1118" height="418" rx="24" fill="var(--bg)" stroke="var(--line)"/>
  <line x1="116" y1="130" x2="1008" y2="130" stroke="var(--line)" stroke-width="2"/>

  <g transform="translate(48 62)">
    <circle cx="70" cy="68" r="42" fill="var(--soft)" stroke="var(--ink)" stroke-width="2"/>
    <path d="M48 76h44M58 58l12-12 12 12M70 46v42" stroke="var(--ink)" stroke-width="2" fill="none"/>
    <text x="0" y="150" class="head">Physical reality</text>
    <text x="0" y="174" class="small muted">components · flows · limits</text>
    <text x="0" y="194" class="small muted">hazards · services · units</text>
  </g>

  <g transform="translate(258 62)">
    <circle cx="70" cy="68" r="42" fill="var(--soft)" stroke="var(--accent-stroke)" stroke-width="2"/>
    <circle cx="52" cy="68" r="6" fill="var(--accent)"/><circle cx="88" cy="50" r="6" fill="var(--accent)"/><circle cx="90" cy="88" r="6" fill="var(--accent)"/>
    <path d="M57 65l25-12M57 72l27 13" stroke="var(--accent-stroke)" stroke-width="2"/>
    <text x="0" y="150" class="head">Causal mechanisms</text>
    <text x="0" y="174" class="small muted">source → mechanism → effect</text>
    <text x="0" y="194" class="small muted">direction · delay · evidence</text>
  </g>

  <g transform="translate(468 62)">
    <circle cx="70" cy="68" r="42" fill="var(--soft)" stroke="var(--blue)" stroke-width="2"/>
    <path d="M38 77C50 43 85 39 102 62C118 84 93 108 68 99C48 92 44 77 52 64" fill="none" stroke="var(--blue)" stroke-width="2.4"/>
    <text x="0" y="150" class="head">Mathematical structure</text>
    <text x="0" y="174" class="small muted">graphs · dynamics · geometry</text>
    <text x="0" y="194" class="math blue">G → F<tspan dy="5" font-size="11">G</tspan></text>
  </g>

  <g transform="translate(688 62)">
    <circle cx="70" cy="68" r="42" fill="var(--soft)" stroke="var(--blue)" stroke-width="2"/>
    <path d="M41 81C52 55 70 46 94 55M43 90C61 73 83 72 101 83" fill="none" stroke="var(--blue)" stroke-width="2"/>
    <path d="M50 44v45M70 38v54M90 46v43" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="0" y="150" class="head">Uncertainty + validation</text>
    <text x="0" y="174" class="small muted">parameters · observations</text>
    <text x="0" y="194" class="small muted">verification ≠ validation</text>
  </g>

  <g transform="translate(908 62)">
    <circle cx="70" cy="68" r="42" fill="var(--soft)" stroke="var(--accent-stroke)" stroke-width="2"/>
    <path d="M47 75l15 14 31-39" fill="none" stroke="var(--accent-stroke)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="150" class="head">Engineering decision</text>
    <text x="0" y="174" class="small muted">design · control · restore</text>
    <text x="0" y="194" class="math accent">u<tspan dy="-6" font-size="11">★</tspan></text>
  </g>

  <g fill="var(--accent)">
    <path d="M204 125l14 5-14 5z"/><path d="M414 125l14 5-14 5z"/><path d="M624 125l14 5-14 5z"/><path d="M844 125l14 5-14 5z"/>
  </g>

  <text x="48" y="365" class="small muted">Order matters: the engineering system constrains the model; the model does not define the physical system by itself.</text>
</svg>
