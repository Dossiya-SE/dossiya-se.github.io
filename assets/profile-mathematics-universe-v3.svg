<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Dossiya-SE profile mathematics universe</title>
  <desc id="desc">A profile-wide mathematical architecture connecting foundations, dynamics, networks, inference, uncertainty, viability, optimization, and domain applications. Arrows indicate mathematical workflow and conceptual dependence, not causal evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101d"/><stop offset="0.55" stop-color="#0b1d33"/><stop offset="1" stop-color="#071522"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f8fb3"/></marker>
    <style>
      .title{font:700 42px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#f4f8ff}.subtitle{font:400 18px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#a9bdd3}.section{font:700 18px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#d7e6f7;letter-spacing:1.4px}.cardTitle{font:700 18px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#f7fbff}.body{font:400 15px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#adc2d8}.math{font:600 20px Georgia,Times New Roman,serif;fill:#eef7ff}.mathSmall{font:600 16px Georgia,Times New Roman,serif;fill:#e6f1ff}.tiny{font:500 12px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#87a2bf}.card{fill:#0d223a;stroke:#274667;stroke-width:1.5}.card2{fill:#10283e;stroke:#2c5477;stroke-width:1.5}.source{fill:#101f46;stroke:#5367d7;stroke-width:1.5}.viable{fill:#0c2a29;stroke:#2f9b78;stroke-width:1.5}.uncertain{fill:#332713;stroke:#d7a633;stroke-width:1.5}.decision{fill:#332b12;stroke:#d9af36;stroke-width:1.5}.flow{fill:none;stroke:#6f8fb3;stroke-width:2;marker-end:url(#arrow);opacity:.78}.flowDash{fill:none;stroke:#b56fd7;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow);opacity:.82}.chip{fill:#10273c;stroke:#355a7b;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="940" rx="28" fill="url(#bg)"/><circle cx="1380" cy="110" r="180" fill="#1f6feb" opacity="0.06"/><circle cx="1480" cy="800" r="220" fill="#4ec9b0" opacity="0.04"/>
  <text x="72" y="72" class="title">Mathematics as a Research Operating System</text><text x="72" y="108" class="subtitle">Profile-wide visual grammar: source mathematics → models → computation → verification → bounded scientific decisions</text><text x="1370" y="77" text-anchor="end" class="tiny">V3 · semantics before decoration</text>
  <text x="72" y="164" class="section">FOUNDATIONS</text>
  <rect x="72" y="184" width="260" height="124" rx="18" class="source" filter="url(#shadow)"/><text x="94" y="218" class="cardTitle">Analysis + Calculus</text><text x="94" y="251" class="mathSmall">∂, ∇, ∫, d/dt</text><text x="94" y="280" class="body">limits · derivatives · integrals · variational structure</text>
  <rect x="352" y="184" width="260" height="124" rx="18" class="source" filter="url(#shadow)"/><text x="374" y="218" class="cardTitle">Linear + Tensor Algebra</text><text x="374" y="251" class="mathSmall">Ax=b · gᵢⱼ · Rⁱⱼₖₗ</text><text x="374" y="280" class="body">operators · eigenstructure · multilinear geometry</text>
  <rect x="632" y="184" width="260" height="124" rx="18" class="source" filter="url(#shadow)"/><text x="654" y="218" class="cardTitle">Differential Geometry</text><text x="654" y="251" class="mathSmall">gαβ · Γαβγ · K · geodesics</text><text x="654" y="280" class="body">metric · connection · curvature · topology bridge</text>
  <rect x="912" y="184" width="260" height="124" rx="18" class="source" filter="url(#shadow)"/><text x="934" y="218" class="cardTitle">Probability + Statistics</text><text x="934" y="251" class="mathSmall">𝔼[X] · Cov · ℙ(A)</text><text x="934" y="280" class="body">uncertainty · inference · reliability · sampling</text>
  <rect x="1192" y="184" width="336" height="124" rx="18" class="source" filter="url(#shadow)"/><text x="1214" y="218" class="cardTitle">Numerical + Computational Mathematics</text><text x="1214" y="251" class="mathSmall">discretize → solve → converge → verify</text><text x="1214" y="280" class="body">ODE/PDE solvers · optimization · Monte Carlo · formal checks</text>
  <text x="72" y="370" class="section">CORE MATHEMATICAL OPERATORS</text>
  <rect x="72" y="392" width="296" height="150" rx="20" class="card" filter="url(#shadow)"/><text x="94" y="426" class="cardTitle">Dynamics</text><text x="94" y="464" class="math">ẋ = F(x,z,m,u,η;θ)</text><text x="94" y="495" class="body">nonlinear · hybrid · multiscale · constrained</text><text x="94" y="520" class="tiny">state evolution is not evidence until calibrated/validated</text>
  <rect x="388" y="392" width="296" height="150" rx="20" class="card2" filter="url(#shadow)"/><text x="410" y="426" class="cardTitle">Networks + Interfaces</text><text x="410" y="464" class="math">L = D − A · Gᵢⱼ(t)</text><text x="410" y="495" class="body">topology · coupling · latency · cascading</text><text x="410" y="520" class="tiny">edge ≠ causal effect unless evidence establishes causality</text>
  <rect x="704" y="392" width="296" height="150" rx="20" class="uncertain" filter="url(#shadow)"/><text x="726" y="426" class="cardTitle">Inference + Uncertainty</text><text x="726" y="464" class="math">π(θ|y) ∝ L(y|θ)π₀(θ)</text><text x="726" y="495" class="body">inverse problems · UQ · sensitivity · identifiability</text><text x="726" y="520" class="tiny">uncertainty bands require a declared construction</text>
  <rect x="1020" y="392" width="296" height="150" rx="20" class="viable" filter="url(#shadow)"/><text x="1042" y="426" class="cardTitle">Viability + Recovery</text><text x="1042" y="464" class="math">x₀ ∈ 𝒱ᴿ ⊂ Kᴿ</text><text x="1042" y="495" class="body">admissibility · reachability · capture · recovery time</text><text x="1042" y="520" class="tiny">viable ≠ recoverable ≠ globally optimal</text>
  <rect x="1336" y="392" width="192" height="150" rx="20" class="decision" filter="url(#shadow)"/><text x="1358" y="426" class="cardTitle">Decision</text><text x="1358" y="464" class="math">u* , d*</text><text x="1358" y="495" class="body">control</text><text x="1358" y="517" class="body">optimization</text>
  <path d="M 368 467 C 378 467 378 467 388 467" class="flow"/><path d="M 684 467 C 694 467 694 467 704 467" class="flow"/><path d="M 1000 467 C 1010 467 1010 467 1020 467" class="flow"/><path d="M 1316 467 C 1326 467 1326 467 1336 467" class="flow"/>
  <text x="72" y="606" class="section">GEOMETRIC RESEARCH BRIDGE</text>
  <rect x="72" y="628" width="710" height="174" rx="22" class="card" filter="url(#shadow)"/><text x="96" y="663" class="cardTitle">Differential geometry — source mathematics</text><text x="96" y="700" class="mathSmall">gαβ = ∂αr · ∂βr</text><text x="96" y="730" class="mathSmall">d²uα/ds² + Γαβγ (duβ/ds)(duγ/ds) = 0</text><text x="96" y="760" class="mathSmall">K = (eg − f²)/(EG − F²) · ∬ K dσ = 2πχ</text><text x="96" y="786" class="tiny">Sochi foundation: metric, connection, curvature, geodesics, Frenet–Serret, Gauss–Bonnet</text>
  <rect x="818" y="628" width="710" height="174" rx="22" class="card2" filter="url(#shadow)"/><text x="842" y="663" class="cardTitle">Research transfer — must be formally defined and tested</text><text x="842" y="700" class="mathSmall">∂𝒱ᴿ  →  candidate recovery/viability geometry</text><text x="842" y="730" class="mathSmall">d_H(𝒱dynamic, 𝒱static)  →  boundary deformation</text><text x="842" y="760" class="mathSmall">κ[path], K[boundary]  ?→  resilience indicators</text><text x="842" y="786" class="tiny">dashed implication = hypothesis/model transfer, not a theorem or empirical fact</text><path d="M 782 715 C 795 715 805 715 818 715" class="flowDash"/>
  <text x="72" y="854" class="section">PORTFOLIO DOMAINS</text>
  <g transform="translate(72 874)"><rect width="212" height="38" rx="19" class="chip"/><text x="106" y="25" text-anchor="middle" class="body">Infrastructure resilience</text></g><g transform="translate(296 874)"><rect width="188" height="38" rx="19" class="chip"/><text x="94" y="25" text-anchor="middle" class="body">Energy systems</text></g><g transform="translate(496 874)"><rect width="206" height="38" rx="19" class="chip"/><text x="103" y="25" text-anchor="middle" class="body">Quantitative finance</text></g><g transform="translate(714 874)"><rect width="210" height="38" rx="19" class="chip"/><text x="105" y="25" text-anchor="middle" class="body">Data science + ML</text></g><g transform="translate(936 874)"><rect width="212" height="38" rx="19" class="chip"/><text x="106" y="25" text-anchor="middle" class="body">Metrology + traceability</text></g><g transform="translate(1160 874)"><rect width="174" height="38" rx="19" class="chip"/><text x="87" y="25" text-anchor="middle" class="body">Decision systems</text></g><g transform="translate(1346 874)"><rect width="182" height="38" rx="19" class="chip"/><text x="91" y="25" text-anchor="middle" class="body">Scientific computing</text></g>
</svg>
