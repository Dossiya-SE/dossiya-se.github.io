<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Profile-wide mathematics universe</title><desc id="desc">Adaptive mathematical map connecting foundations, dynamics, networks, inference, uncertainty, viability, optimization and domain applications. Arrows indicate conceptual or computational dependence, not causal evidence.</desc><style>:root{--bg:#fff;--panel:#f8fafc;--panel2:#f1f5f9;--fg:#0f172a;--muted:#475569;--grid:#e2e8f0;--border:#94a3b8;--source:#4338ca;--state:#1d4ed8;--interface:#7e22ce;--unc:#b45309;--viable:#047857;--recovery:#0f766e;--decision:#a16207;--hyp:#be185d}@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--panel2:#12243a;--fg:#eaf1f8;--muted:#9eb0c3;--grid:#28445f;--border:#355a7b;--source:#a5b4fc;--state:#60a5fa;--interface:#c084fc;--unc:#fbbf24;--viable:#34d399;--recovery:#5eead4;--decision:#facc15;--hyp:#f472b6}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.panel2{fill:var(--panel2);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.grid{stroke:var(--grid)}.state{stroke:var(--state);fill:none}.iface{stroke:var(--interface);fill:none}.unc{stroke:var(--unc);fill:none}.viable{stroke:var(--viable);fill:none}.recovery{stroke:var(--recovery);fill:none}.decision{stroke:var(--decision);fill:none}.hyp{stroke:var(--hyp);fill:none;stroke-dasharray:8 6}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}</style><rect class="bg" width="1600" height="900" rx="26"/><g class="grid" opacity=".4"><path d="M0 90H1600M0 180H1600M0 270H1600M0 360H1600M0 450H1600M0 540H1600M0 630H1600M0 720H1600M0 810H1600"/><path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/></g><text x="70" y="72" class="fg" font-size="40" font-weight="800">MATHEMATICS AS A RESEARCH OPERATING SYSTEM</text><text x="70" y="108" class="muted" font-size="18">source mathematics → models → computation → verification → bounded scientific decisions</text><text x="70" y="160" class="muted" font-size="14" font-weight="700">FOUNDATIONS</text><rect x="70" y="182" width="276" height="110" rx="16" class="panel"/><text x="92" y="216" class="fg" font-size="18" font-weight="700">Analysis + Calculus</text><text x="92" y="250" class="fg math" font-size="20">∂ · ∇ · ∫ · d/dt</text><rect x="366" y="182" width="276" height="110" rx="16" class="panel"/><text x="388" y="216" class="fg" font-size="18" font-weight="700">Linear + Tensor Algebra</text><text x="388" y="250" class="fg math" font-size="20">Ax=b · gᵢⱼ · Rⁱⱼₖₗ</text><rect x="662" y="182" width="276" height="110" rx="16" class="panel"/><text x="684" y="216" class="fg" font-size="18" font-weight="700">Differential Geometry</text><text x="684" y="250" class="fg math" font-size="20">gαβ · Γᵅβγ · K · γ(s)</text><rect x="958" y="182" width="276" height="110" rx="16" class="panel"/><text x="980" y="216" class="fg" font-size="18" font-weight="700">Probability + Statistics</text><text x="980" y="250" class="fg math" font-size="20">ℙ(A) · 𝔼[X] · Cov</text><rect x="1254" y="182" width="276" height="110" rx="16" class="panel"/><text x="1276" y="216" class="fg" font-size="18" font-weight="700">Numerical Mathematics</text><text x="1276" y="250" class="fg math" font-size="20">discretize → solve → verify</text><text x="70" y="348" class="muted" font-size="14" font-weight="700">CORE OPERATORS</text><rect x="70" y="370" width="280" height="170" rx="18" class="panel2"/><text x="94" y="407" class="fg" font-size="20" font-weight="700">Dynamics</text><text x="94" y="446" class="fg math" font-size="23">ẋ=F(x,z,m,u,η;θ)</text><path d="M96 490C140 440 195 525 245 465S315 475 330 430" class="state" stroke-width="4"/><rect x="370" y="370" width="280" height="170" rx="18" class="panel2"/><text x="394" y="407" class="fg" font-size="20" font-weight="700">Networks + Interfaces</text><text x="394" y="446" class="fg math" font-size="23">L=D−A · Gᵢⱼ(t)</text><circle cx="432" cy="491" r="13" fill="var(--state)"/><circle cx="510" cy="470" r="13" fill="var(--viable)"/><circle cx="590" cy="497" r="13" fill="var(--interface)"/><path d="M445 488L497 474M523 474L578 493M444 493L577 497" class="iface" stroke-width="3"/><rect x="670" y="370" width="280" height="170" rx="18" class="panel2"/><text x="694" y="407" class="fg" font-size="20" font-weight="700">Inference + Uncertainty</text><text x="694" y="446" class="fg math" font-size="22">π(θ|y)∝L(y|θ)π₀(θ)</text><path d="M702 490C740 465 770 455 810 468S875 507 926 481" class="unc" stroke-width="18" opacity=".22"/><path d="M702 490C740 465 770 455 810 468S875 507 926 481" class="state" stroke-width="3"/><rect x="970" y="370" width="280" height="170" rx="18" class="panel2"/><text x="994" y="407" class="fg" font-size="20" font-weight="700">Viability + Recovery</text><text x="994" y="446" class="fg math" font-size="22">V⊂K · C⊃V</text><path d="M1012 510C1025 450 1105 435 1178 468C1225 490 1210 524 1152 522C1080 520 1020 550 1012 510Z" class="viable" stroke-width="3"/><path d="M1025 526C1055 500 1080 493 1110 482" class="recovery" stroke-width="4"/><rect x="1270" y="370" width="260" height="170" rx="18" class="panel2"/><text x="1294" y="407" class="fg" font-size="20" font-weight="700">Control + Design</text><text x="1294" y="446" class="fg math" font-size="22">u* · d* · Pareto</text><path d="M1298 510C1340 485 1380 455 1420 452S1480 470 1505 495" class="decision" stroke-width="4"/><text x="70" y="600" class="muted" font-size="14" font-weight="700">DIFFERENTIAL-GEOMETRY BRIDGE</text><rect x="70" y="620" width="700" height="170" rx="18" class="panel"/><text x="94" y="657" class="fg" font-size="19" font-weight="700">[S] source mathematics</text><text x="94" y="697" class="fg math" font-size="21">gαβ=∂αr·∂βr</text><text x="94" y="730" class="fg math" font-size="21">d²uᵅ/ds²+Γᵅβγ(duᵝ/ds)(duᵞ/ds)=0</text><text x="94" y="763" class="fg math" font-size="21">K=(eg−f²)/(EG−F²) · ∬K dA=2πχ</text><rect x="800" y="620" width="730" height="170" rx="18" class="panel"/><text x="824" y="657" class="fg" font-size="19" font-weight="700">[H] research transfer requires definition + test</text><text x="824" y="697" class="fg math" font-size="20">∂Vᴿ → candidate viability/recovery geometry</text><text x="824" y="730" class="fg math" font-size="20">d_H(Vdynamic,Vstatic) → boundary deformation</text><text x="824" y="763" fill="var(--hyp)" class="math" font-size="20">κ[path],K[boundary] ?→ resilience indicators</text><text x="70" y="845" class="muted" font-size="14">theme changes presentation only · equations, geometry, values and evidence states remain invariant</text></svg>