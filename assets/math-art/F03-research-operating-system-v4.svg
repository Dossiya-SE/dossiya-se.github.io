<svg xmlns="http://www.w3.org/2000/svg" role="img" data-figure-id="F03" viewBox="0 0 2400 1350" aria-labelledby="title desc">
  <title id="title">Mathematical Research Operating System V4</title>
  <desc id="desc">A vector pipeline showing the required progression from evidence through definitions, models, computation, verification and validation to bounded decisions.</desc>
  <defs><linearGradient id="bg3" x1="0" x2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#0a1b2b"/></linearGradient><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4ec9b0"/></marker></defs>
  <rect width="2400" height="1350" fill="url(#bg3)"/>
  <g data-layout-box="120,90,2160,180"><text x="120" y="148" fill="#4ec9b0" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="5">F03 · RESEARCH OPERATING SYSTEM</text><text x="120" y="230" fill="#edf5fb" font-size="65" font-family="Inter,Arial,sans-serif" font-weight="800">Mechanism before decoration. Evidence before claim.</text></g>
  <g data-layout-box="120,330,2160,520">
    <rect x="120" y="330" width="2160" height="520" rx="38" fill="#0d1e31" stroke="#31516a" stroke-width="2"/>
    <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g><rect x="180" y="480" width="250" height="160" rx="28" fill="#10283f" stroke="#6cb6ff" stroke-width="3"/><text x="305" y="545" fill="#6cb6ff" font-size="25" font-weight="700">[S/E]</text><text x="305" y="594" fill="#edf5fb" font-size="31" font-weight="700">Evidence</text></g><g><rect x="500" y="480" width="270" height="160" rx="28" fill="#10283f" stroke="#83d7c7" stroke-width="3"/><text x="635" y="545" fill="#83d7c7" font-size="25" font-weight="700">[D]</text><text x="635" y="585" fill="#edf5fb" font-size="28" font-weight="700">Definitions</text><text x="635" y="618" fill="#9fb6c8" font-size="22">+ assumptions</text></g><g><rect x="840" y="480" width="250" height="160" rx="28" fill="#0f2b34" stroke="#4ec9b0" stroke-width="3"/><text x="965" y="545" fill="#4ec9b0" font-size="25" font-weight="700">[M]</text><text x="965" y="594" fill="#edf5fb" font-size="31" font-weight="700">Model</text></g><g><rect x="1160" y="480" width="270" height="160" rx="28" fill="#241e38" stroke="#c6a0f6" stroke-width="3"/><text x="1295" y="545" fill="#c6a0f6" font-size="25" font-weight="700">[C]</text><text x="1295" y="594" fill="#edf5fb" font-size="29" font-weight="700">Computation</text></g><g><rect x="1500" y="480" width="270" height="160" rx="28" fill="#162b1f" stroke="#8bd450" stroke-width="3"/><text x="1635" y="545" fill="#8bd450" font-size="25" font-weight="700">[V]</text><text x="1635" y="594" fill="#edf5fb" font-size="29" font-weight="700">Verification</text></g><g><rect x="1840" y="480" width="250" height="160" rx="28" fill="#2a2720" stroke="#f4c95d" stroke-width="3"/><text x="1965" y="545" fill="#f4c95d" font-size="25" font-weight="700">[E]</text><text x="1965" y="594" fill="#edf5fb" font-size="29" font-weight="700">Validation</text></g></g>
    <g stroke="#4ec9b0" stroke-width="5" fill="none" marker-end="url(#a3)"><path d="M430 560 H490"/><path d="M770 560 H830"/><path d="M1090 560 H1150"/><path d="M1430 560 H1490"/><path d="M1770 560 H1830"/></g>
    <rect x="570" y="710" width="1260" height="92" rx="46" fill="#122941" stroke="#31516a"/><text x="1200" y="768" text-anchor="middle" fill="#edf5fb" font-size="28" font-family="ui-monospace,Menlo,monospace">claim strength ≤ evidence + specification + verification + relevant validation</text>
  </g>
  <g data-layout-box="120,910,2160,300"><rect x="120" y="910" width="2160" height="300" rx="36" fill="#091827" stroke="#31516a"/><text x="180" y="984" fill="#9fb6c8" font-size="24" font-family="Inter,Arial,sans-serif" letter-spacing="3">RELEASE BOUNDARY</text><text x="180" y="1056" fill="#edf5fb" font-size="34" font-family="Inter,Arial,sans-serif" font-weight="700">Passing tests verifies implementation properties; it does not manufacture empirical validation.</text><text x="180" y="1120" fill="#9fb6c8" font-size="27" font-family="Inter,Arial,sans-serif">Final figures may communicate only the strongest claim supported by their provenance state.</text><text x="180" y="1172" fill="#ff9f7a" font-size="24" font-family="ui-monospace,Menlo,monospace">Simulation ≠ observation · association ≠ causation · source theorem ≠ original contribution</text></g>
</svg>
