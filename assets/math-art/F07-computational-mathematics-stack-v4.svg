<svg xmlns="http://www.w3.org/2000/svg" role="img" data-figure-id="F07" viewBox="0 0 2400 1350" aria-labelledby="title desc">
  <title id="title">Computational Mathematics Stack V4</title>
  <desc id="desc">A vector stack assigning languages and tools to mathematical specification, symbolic verification, numerical computation, rendering, performance and formal proof.</desc>
  <defs><linearGradient id="bg7" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#0b1c2d"/></linearGradient></defs>
  <rect width="2400" height="1350" fill="url(#bg7)"/>
  <g data-layout-box="120,90,2160,180"><text x="120" y="148" fill="#4ec9b0" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="5">F07 · COMPUTATIONAL MATHEMATICS STACK</text><text x="120" y="230" fill="#edf5fb" font-size="65" font-family="Inter,Arial,sans-serif" font-weight="800">One language per role. One result across the stack.</text></g>
  <g data-layout-box="120,330,2160,780"><rect x="120" y="330" width="2160" height="780" rx="36" fill="#0d1e31" stroke="#31516a"/><g font-family="Inter,Arial,sans-serif"><text x="180" y="410" fill="#9fb6c8" font-size="23" letter-spacing="3">SCIENTIFIC CHAIN</text><g><rect x="180" y="455" width="2040" height="92" rx="28" fill="#10283f" stroke="#6cb6ff" stroke-width="2"/><text x="230" y="513" fill="#6cb6ff" font-size="28" font-weight="700">SPECIFICATION</text><text x="790" y="513" fill="#edf5fb" font-size="28">LaTeX · definitions · assumptions · units · provenance</text></g><g><rect x="180" y="570" width="2040" height="92" rx="28" fill="#11283b" stroke="#83d7c7" stroke-width="2"/><text x="230" y="628" fill="#83d7c7" font-size="28" font-weight="700">SYMBOLIC</text><text x="790" y="628" fill="#edf5fb" font-size="28">SymPy / Mathematica · independent algebraic checks</text></g><g><rect x="180" y="685" width="2040" height="92" rx="28" fill="#0f2b34" stroke="#4ec9b0" stroke-width="2"/><text x="230" y="743" fill="#4ec9b0" font-size="28" font-weight="700">NUMERICAL</text><text x="790" y="743" fill="#edf5fb" font-size="28">Python / Julia · ODE/PDE · geometry · UQ · optimization</text></g><g><rect x="180" y="800" width="2040" height="92" rx="28" fill="#241e38" stroke="#c6a0f6" stroke-width="2"/><text x="230" y="858" fill="#c6a0f6" font-size="28" font-weight="700">VISUAL</text><text x="790" y="858" fill="#edf5fb" font-size="28">SVG / TikZ · D3 · Makie · PyVista/VTK · GLSL</text></g><g><rect x="180" y="915" width="2040" height="92" rx="28" fill="#162b1f" stroke="#8bd450" stroke-width="2"/><text x="230" y="973" fill="#8bd450" font-size="28" font-weight="700">VERIFY / SCALE</text><text x="790" y="973" fill="#edf5fb" font-size="28">CI · analytic oracles · C++/CUDA when justified · Lean selectively</text></g></g></g>
  <g data-layout-box="120,1160,2160,100"><text x="120" y="1217" fill="#9fb6c8" font-size="24" font-family="Inter,Arial,sans-serif">Tool presence is never used as evidence of proficiency or validation; every technology must have a measurable scientific role.</text></g>
</svg>
