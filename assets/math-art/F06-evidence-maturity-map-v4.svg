<svg xmlns="http://www.w3.org/2000/svg" role="img" data-figure-id="F06" viewBox="0 0 2400 1350" aria-labelledby="title desc">
  <title id="title">Evidence Maturity Map V4</title>
  <desc id="desc">A descriptive two-axis map separating implementation maturity from evidence maturity. Positions are qualitative governance states, not rankings or certifications.</desc>
  <defs><linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#0a1b2c"/></linearGradient><marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9fb6c8"/></marker></defs>
  <rect width="2400" height="1350" fill="url(#bg6)"/>
  <g data-layout-box="120,80,2160,200">
    <text x="120" y="140" fill="#4ec9b0" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="5">F06 · EVIDENCE MATURITY MAP</text>
    <text x="120" y="225" fill="#edf5fb" font-size="64" font-family="Inter,Arial,sans-serif" font-weight="800">Implementation maturity ≠ evidence maturity.</text>
    <text x="120" y="276" fill="#9fb6c8" font-size="27" font-family="Inter,Arial,sans-serif">Descriptive governance map only; position is not certification, prestige, or a universal ranking.</text>
  </g>
  <g data-layout-box="120,340,1660,850">
    <rect x="120" y="340" width="1660" height="850" rx="36" fill="#0d1e31" fill-opacity=".72" stroke="#31516a" stroke-width="2"/>
    <line x1="300" y1="1050" x2="1650" y2="1050" stroke="#9fb6c8" stroke-width="4" marker-end="url(#arrow6)"/>
    <line x1="300" y1="1050" x2="300" y2="455" stroke="#9fb6c8" stroke-width="4" marker-end="url(#arrow6)"/>
    <g fill="#9fb6c8" font-size="23" font-family="Inter,Arial,sans-serif"><text x="650" y="1105" text-anchor="middle">specified</text><text x="1060" y="1105" text-anchor="middle">executable</text><text x="1470" y="1105" text-anchor="middle">tested / reproducible</text><text x="250" y="1000" text-anchor="end">hypothesis</text><text x="250" y="790" text-anchor="end">model / source</text><text x="250" y="580" text-anchor="end">empirical / validated</text></g>
    <g stroke="#31516a" stroke-width="2" stroke-dasharray="7 10" opacity=".72"><line x1="300" y1="840" x2="1660" y2="840"/><line x1="300" y1="630" x2="1660" y2="630"/><line x1="720" y1="450" x2="720" y2="1050"/><line x1="1140" y1="450" x2="1140" y2="1050"/></g>
    <g font-family="Inter,Arial,sans-serif">
      <rect x="500" y="905" width="36" height="36" fill="#ff9f7a"/><text x="555" y="933" fill="#edf5fb" font-size="24">Prototype / scaffold</text>
      <circle cx="870" cy="760" r="19" fill="#4ec9b0"/><text x="905" y="768" fill="#edf5fb" font-size="24">Research model implemented</text>
      <circle cx="1320" cy="735" r="19" fill="#8bd450"/><text x="1355" y="743" fill="#edf5fb" font-size="24">Verified computation</text>
      <circle cx="1430" cy="540" r="19" fill="#f4c95d"/><text x="1465" y="548" fill="#edf5fb" font-size="24">Empirical result</text>
      <circle cx="1550" cy="470" r="24" fill="none" stroke="#6cb6ff" stroke-width="5"/><text x="1590" y="478" fill="#6cb6ff" font-size="24">Field-validated target</text>
      <circle cx="600" cy="720" r="19" fill="#6cb6ff"/><text x="635" y="728" fill="#edf5fb" font-size="24">Source mathematics</text>
    </g>
  </g>
  <g data-layout-box="1840,340,440,850">
    <rect x="1840" y="340" width="440" height="850" rx="36" fill="#122941" stroke="#31516a" stroke-width="2"/>
    <text x="1890" y="420" fill="#9fb6c8" font-size="24" font-family="Inter,Arial,sans-serif" letter-spacing="3">LEGEND</text>
    <circle cx="1915" cy="500" r="17" fill="#4ec9b0"/><text x="1955" y="508" fill="#edf5fb" font-size="24" font-family="Inter,Arial,sans-serif">evidence-bearing implementation</text>
    <rect x="1898" y="565" width="34" height="34" fill="#ff9f7a"/><text x="1955" y="591" fill="#edf5fb" font-size="24" font-family="Inter,Arial,sans-serif">prototype / scaffold</text>
    <circle cx="1915" cy="675" r="18" fill="none" stroke="#6cb6ff" stroke-width="4"/><text x="1955" y="683" fill="#edf5fb" font-size="24" font-family="Inter,Arial,sans-serif">target, not achieved claim</text>
    <line x1="1895" y1="750" x2="2225" y2="750" stroke="#31516a"/>
    <text x="1890" y="815" fill="#edf5fb" font-size="26" font-family="Inter,Arial,sans-serif" font-weight="700">Governance rule</text>
    <text x="1890" y="870" fill="#9fb6c8" font-size="23" font-family="Inter,Arial,sans-serif">Passing software tests may move an</text>
    <text x="1890" y="908" fill="#9fb6c8" font-size="23" font-family="Inter,Arial,sans-serif">artifact rightward. It does not move</text>
    <text x="1890" y="946" fill="#9fb6c8" font-size="23" font-family="Inter,Arial,sans-serif">it upward to empirical validation.</text>
    <text x="1890" y="1030" fill="#ff9f7a" font-size="23" font-family="Inter,Arial,sans-serif">Verification ≠ validation.</text>
  </g>
</svg>
