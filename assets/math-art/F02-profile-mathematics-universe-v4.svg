      <g fill="#edf5fb" font-size="30" font-weight="700" text-anchor="middle"><text x="590" y="1130">Numerical Methods</text><text x="1200" y="1130">Uncertainty Quantification</text><text x="1810" y="1130">Scientific ML</text></g>
      <text x="180" y="1245" fill="#9fb6c8" font-size="23" letter-spacing="3">LEVEL 4 · BOUNDED DECISION</text>
      <g fill="#2a2720" stroke="#f4c95d" stroke-width="3"><rect x="420" y="1272" width="420" height="94" rx="24"/><rect x="990" y="1272" width="420" height="94" rx="24"/><rect x="1560" y="1272" width="420" height="94" rx="24"/></g>
      <g fill="#edf5fb" font-size="28" font-weight="700" text-anchor="middle"><text x="630" y="1332">Viability</text><text x="1200" y="1332">Control</text><text x="1770" y="1332">Decision</text></g>
    </g>
    <g stroke="#466c87" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity=".76"><path d="M1200 498 C1200 540 1240 555 1240 595"/><path d="M1240 721 C1240 775 1515 775 1515 820"/><path d="M810 721 C810 780 475 780 475 820"/><path d="M1670 721 C1670 785 1515 785 1515 820"/><path d="M2030 721 C2030 780 2000 785 2000 820"/><path d="M475 950 C475 1010 590 1010 590 1050"/><path d="M1515 950 C1515 1000 1200 1010 1200 1050"/><path d="M2000 950 C2000 1010 1810 1010 1810 1050"/><path d="M590 1180 C590 1230 630 1230 630 1272"/><path d="M1200 1180 L1200 1272"/><path d="M1810 1180 C1810 1230 1770 1230 1770 1272"/></g>
  </g>
  <g data-layout-box="120,1440,2160,80"><text x="120" y="1490" fill="#9fb6c8" font-size="24" font-family="Inter,Arial,sans-serif">Layout policy: semantic levels first; collision optimization may refine positions only inside assigned conceptual regions.</text></g>
