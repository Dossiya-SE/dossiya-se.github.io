      <text x="180" y="565" fill="#9fb6c8" font-size="23" letter-spacing="3">LEVEL 1 · STRUCTURES</text>
      <g fill="#10283f" stroke="#6cb6ff" stroke-width="3"><rect x="190" y="595" width="380" height="126" rx="28"/><rect x="620" y="595" width="380" height="126" rx="28"/><rect x="1050" y="595" width="380" height="126" rx="28"/><rect x="1480" y="595" width="380" height="126" rx="28"/><rect x="1900" y="595" width="260" height="126" rx="28"/></g>
      <g fill="#edf5fb" font-size="31" font-weight="700" text-anchor="middle"><text x="380" y="672">Algebra</text><text x="810" y="672">Analysis</text><text x="1240" y="672">Geometry</text><text x="1670" y="672">Probability</text><text x="2030" y="672">Discrete</text></g>
      <text x="180" y="790" fill="#9fb6c8" font-size="23" letter-spacing="3">LEVEL 2 · SYSTEM MATHEMATICS</text>
      <g fill="#0f2b34" stroke="#4ec9b0" stroke-width="3"><rect x="260" y="820" width="430" height="130" rx="28"/><rect x="780" y="820" width="430" height="130" rx="28"/><rect x="1300" y="820" width="430" height="130" rx="28"/><rect x="1820" y="820" width="360" height="130" rx="28"/></g>
      <g fill="#edf5fb" font-size="30" font-weight="700" text-anchor="middle"><text x="475" y="900">ODE / PDE</text><text x="995" y="900">Networks</text><text x="1515" y="900">Inverse Problems</text><text x="2000" y="900">Optimization</text></g>
      <text x="180" y="1020" fill="#9fb6c8" font-size="23" letter-spacing="3">LEVEL 3 · COMPUTATION</text>
