<svg xmlns="http://www.w3.org/2000/svg" role="img" data-figure-id="F02" viewBox="0 0 2400 1600" aria-labelledby="title desc">
  <title id="title">Profile Mathematics Universe V4</title>
  <desc id="desc">A semantic-layered vector map from mathematical foundations through dynamics, inference, computation and decision, with constrained placement rather than unconstrained force layout.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#09192a"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#466c87"/></marker></defs>
  <rect width="2400" height="1600" fill="url(#bg2)"/>
  <g data-layout-box="120,80,2160,220"><text x="120" y="138" fill="#4ec9b0" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="5">F02 · SEMANTIC MATHEMATICS UNIVERSE</text><text x="120" y="222" fill="#edf5fb" font-size="68" font-family="Inter,Arial,sans-serif" font-weight="800">Foundations → Models → Computation → Decisions</text><text x="120" y="276" fill="#9fb6c8" font-size="27" font-family="Inter,Arial,sans-serif">Conceptual dependence only; links are not theorem-level implication or causal evidence.</text></g>
  <g data-layout-box="120,340,2160,1060">
    <rect x="120" y="340" width="2160" height="1060" rx="36" fill="#0d1e31" fill-opacity=".68" stroke="#31516a" stroke-width="2"/>
