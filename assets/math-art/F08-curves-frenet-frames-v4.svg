rified invariants</text><text x="1735" y="880" fill="#9fb6c8" font-size="26" font-family="ui-monospace,Menlo,monospace" font-weight="400" text-anchor="start" >‖T‖ = ‖N‖ = ‖B‖ = 1</text><text x="1735" y="930" fill="#9fb6c8" font-size="26" font-family="ui-monospace,Menlo,monospace" font-weight="400" text-anchor="start" >T·N = T·B = N·B = 0</text><text x="1735" y="1035" fill="#edf5fb" font-size="26" font-family="Inter,Arial,sans-serif" font-weight="700" text-anchor="start" >Rendering role</text><text x="1735" y="1090" fill="#6cb6ff" font-size="25" font-family="Inter,Arial,sans-serif" font-weight="400" text-anchor="start" >curve = blue</text><text x="1735" y="1135" fill="#4ec9b0" font-size="25" font-family="Inter,Arial,sans-serif" font-weight="400" text-anchor="start" >tangent = teal</text><text x="1735" y="1180" fill="#ff9f7a" font-size="25" font-family="Inter,Arial,sans-serif" font-weight="400" text-anchor="start" >normal = coral</text><text x="1735" y="1225" fill="#f4c95d" font-size="25" font-family="Inter,Arial,sans-serif" font-weight="400" text-anchor="start" >binormal = gold</text></g></svg>
