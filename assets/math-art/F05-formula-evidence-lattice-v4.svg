<svg xmlns="http://www.w3.org/2000/svg" role="img" data-figure-id="F05" viewBox="0 0 2400 1350" aria-labelledby="title desc">
  <title id="title">Formula Evidence Lattice V4</title>
  <desc id="desc">A vector evidence lattice showing formula provenance, assumptions, implementation, verification, validation and bounded claim states.</desc>
  <defs><linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#091b2b"/></linearGradient><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#466c87"/></marker></defs>
  <rect width="2400" height="1350" fill="url(#bg5)"/>
  <g data-layout-box="120,90,2160,180"><text x="120" y="148" fill="#4ec9b0" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="5">F05 · FORMULA EVIDENCE LATTICE</text><text x="120" y="230" fill="#edf5fb" font-size="65" font-family="Inter,Arial,sans-serif" font-weight="800">An equation is a scientific object, not decoration.</text></g>
  <g data-layout-box="120,330,2160,780"><rect x="120" y="330" width="2160" height="780" rx="36" fill="#0d1e31" stroke="#31516a" stroke-width="2"/><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g transform="translate(180 455)"><rect width="300" height="170" rx="28" fill="#10283f" stroke="#6cb6ff" stroke-width="3"/><text x="150" y="60" fill="#6cb6ff" font-size="25" font-weight="700">01 · PROVENANCE</text><text x="150" y="112" fill="#edf5fb" font-size="27">source / derivation</text></g><g transform="translate(525 455)"><rect width="300" height="170" rx="28" fill="#11283b" stroke="#83d7c7" stroke-width="3"/><text x="150" y="60" fill="#83d7c7" font-size="25" font-weight="700">02 · DOMAIN</text><text x="150" y="112" fill="#edf5fb" font-size="27">assumptions / units</text></g><g transform="translate(870 455)"><rect width="300" height="170" rx="28" fill="#0f2b34" stroke="#4ec9b0" stroke-width="3"/><text x="150" y="60" fill="#4ec9b0" font-size="25" font-weight="700">03 · ROLE</text><text x="150" y="112" fill="#edf5fb" font-size="27">model / hypothesis</text></g><g transform="translate(1215 455)"><rect width="300" height="170" rx="28" fill="#241e38" stroke="#c6a0f6" stroke-width="3"/><text x="150" y="60" fill="#c6a0f6" font-size="25" font-weight="700">04 · CODE</text><text x="150" y="112" fill="#edf5fb" font-size="27">implementation</text></g><g transform="translate(1560 455)"><rect width="300" height="170" rx="28" fill="#162b1f" stroke="#8bd450" stroke-width="3"/><text x="150" y="60" fill="#8bd450" font-size="25" font-weight="700">05 · VERIFY</text><text x="150" y="112" fill="#edf5fb" font-size="27">tests / oracles</text></g><g transform="translate(1905 455)"><rect width="300" height="170" rx="28" fill="#2a2720" stroke="#f4c95d" stroke-width="3"/><text x="150" y="60" fill="#f4c95d" font-size="25" font-weight="700">06 · VALIDATE</text><text x="150" y="112" fill="#edf5fb" font-size="27">relevant evidence</text></g></g><g stroke="#466c87" stroke-width="4" fill="none" marker-end="url(#a5)"><path d="M480 540 H515"/><path d="M825 540 H860"/><path d="M1170 540 H1205"/><path d="M1515 540 H1550"/><path d="M1860 540 H1895"/></g><rect x="390" y="760" width="1620" height="190" rx="34" fill="#091827" stroke="#31516a"/><text x="1200" y="822" text-anchor="middle" fill="#9fb6c8" font-size="24" font-family="Inter,Arial,sans-serif" letter-spacing="3">BOUNDED CLAIM</text><text x="1200" y="880" text-anchor="middle" fill="#edf5fb" font-size="31" font-family="ui-monospace,Menlo,monospace">formula ID → provenance → assumptions → code → verification → validation → claim</text><text x="1200" y="928" text-anchor="middle" fill="#ff9f7a" font-size="23" font-family="Inter,Arial,sans-serif">A stronger-looking equation may never outrank the evidence supporting it.</text></g>
  <g data-layout-box="120,1160,2160,100"><text x="120" y="1218" fill="#9fb6c8" font-size="24" font-family="Inter,Arial,sans-serif">Evidence states: [S] source · [D] derived · [M] model · [C] computed · [V] verified · [E] empirical · [H] hypothesis · [T] target</text></g>
</svg>
