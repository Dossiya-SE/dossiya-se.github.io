<svg xmlns="http://www.w3.org/2000/svg" role="img" data-figure-id="F04" viewBox="0 0 2400 1500" aria-labelledby="title desc">
  <title id="title">Differential Geometry and Research Transfer V4</title>
  <desc id="desc">A three-column vector diagram separating source differential geometry, transfer requirements, and formally defined infrastructure state geometry.</desc>
  <defs><linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#0b1e30"/></linearGradient></defs>
  <rect width="2400" height="1500" fill="url(#bg4)"/>
  <g data-layout-box="120,80,2160,200"><text x="120" y="140" fill="#4ec9b0" font-size="28" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="5">F04 · DIFFERENTIAL GEOMETRY → RESEARCH TRANSFER</text><text x="120" y="226" fill="#edf5fb" font-size="64" font-family="Inter,Arial,sans-serif" font-weight="800">Separate theorem, metaphor, and research-state geometry.</text></g>
  <g data-layout-box="120,340,650,980"><rect x="120" y="340" width="650" height="980" rx="36" fill="#10283f" fill-opacity=".76" stroke="#6cb6ff" stroke-width="3"/><text x="175" y="420" fill="#6cb6ff" font-size="25" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="3">[S] SOURCE MATHEMATICS</text><text x="175" y="486" fill="#edf5fb" font-size="38" font-family="Inter,Arial,sans-serif" font-weight="800">Differential geometry</text><text x="175" y="565" fill="#edf5fb" font-size="27" font-family="ui-monospace,Menlo,monospace">g_ab = ∂_a r · ∂_b r</text><text x="175" y="635" fill="#edf5fb" font-size="25" font-family="ui-monospace,Menlo,monospace">u¨^a + Γ^a_bc u˙^b u˙^c = 0</text><text x="175" y="705" fill="#edf5fb" font-size="27" font-family="ui-monospace,Menlo,monospace">K = (eg − f²)/(EG − F²)</text><line x1="175" y1="758" x2="715" y2="758" stroke="#31516a" stroke-width="2"/><text x="175" y="825" fill="#9fb6c8" font-size="25" font-family="Inter,Arial,sans-serif">Objects:</text><text x="175" y="875" fill="#edf5fb" font-size="26" font-family="Inter,Arial,sans-serif">• metric tensor</text><text x="175" y="925" fill="#edf5fb" font-size="26" font-family="Inter,Arial,sans-serif">• connection / Christoffel symbols</text><text x="175" y="975" fill="#edf5fb" font-size="26" font-family="Inter,Arial,sans-serif">• geodesics</text><text x="175" y="1025" fill="#edf5fb" font-size="26" font-family="Inter,Arial,sans-serif">• curvature</text><text x="175" y="1105" fill="#6cb6ff" font-size="23" font-family="Inter,Arial,sans-serif">Established mathematics remains source mathematics.</text></g>
  <g data-layout-box="875,340,650,980"><rect x="875" y="340" width="650" height="980" rx="36" fill="#171c28" stroke="#ff9f7a" stroke-width="3"/><text x="930" y="420" fill="#ff9f7a" font-size="25" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="3">TRANSFER GATE</text><text x="930" y="490" fill="#edf5fb" font-size="36" font-family="Inter,Arial,sans-serif" font-weight="800">No automatic correspondence</text><text x="930" y="575" fill="#edf5fb" font-size="29" font-family="Inter,Arial,sans-serif">SOURCE THEOREM</text><text x="1200" y="640" text-anchor="middle" fill="#ff9f7a" font-size="50" font-family="Inter,Arial,sans-serif">≠</text><text x="930" y="705" fill="#edf5fb" font-size="29" font-family="Inter,Arial,sans-serif">GEOMETRIC METAPHOR</text><text x="1200" y="770" text-anchor="middle" fill="#ff9f7a" font-size="50" font-family="Inter,Arial,sans-serif">≠</text><text x="930" y="835" fill="#edf5fb" font-size="29" font-family="Inter,Arial,sans-serif">RESEARCH GEOMETRY</text><line x1="930" y1="900" x2="1470" y2="900" stroke="#31516a" stroke-width="2"/><text x="930" y="970" fill="#9fb6c8" font-size="24" font-family="Inter,Arial,sans-serif">Required before transfer:</text><text x="930" y="1022" fill="#edf5fb" font-size="24" font-family="Inter,Arial,sans-serif">1. define state space</text><text x="930" y="1066" fill="#edf5fb" font-size="24" font-family="Inter,Arial,sans-serif">2. define metric / geometry</text><text x="930" y="1110" fill="#edf5fb" font-size="24" font-family="Inter,Arial,sans-serif">3. justify physical interpretation</text><text x="930" y="1154" fill="#edf5fb" font-size="24" font-family="Inter,Arial,sans-serif">4. verify computation</text><text x="930" y="1198" fill="#edf5fb" font-size="24" font-family="Inter,Arial,sans-serif">5. validate only with relevant evidence</text></g>
  <g data-layout-box="1630,340,650,980"><rect x="1630" y="340" width="650" height="980" rx="36" fill="#0f2b34" fill-opacity=".76" stroke="#4ec9b0" stroke-width="3"/><text x="1685" y="420" fill="#4ec9b0" font-size="25" font-family="Inter,Arial,sans-serif" font-weight="700" letter-spacing="3">[M/H] RESEARCH TRANSFER</text><text x="1685" y="486" fill="#edf5fb" font-size="36" font-family="Inter,Arial,sans-serif" font-weight="800">Infrastructure state geometry</text><text x="1685" y="565" fill="#edf5fb" font-size="26" font-family="ui-monospace,Menlo,monospace">X ∈ 𝓧</text><text x="1685" y="625" fill="#edf5fb" font-size="25" font-family="ui-monospace,Menlo,monospace">K_R = K_phys ∩ K_service</text><text x="1685" y="665" fill="#edf5fb" font-size="25" font-family="ui-monospace,Menlo,monospace">      ∩ K_sus ∩ K_eq</text><text x="1685" y="735" fill="#edf5fb" font-size="24" font-family="ui-monospace,Menlo,monospace">𝓥_R = {x₀ : ∃u(·), X(t)∈K_R}</text><line x1="1685" y1="790" x2="2225" y2="790" stroke="#31516a" stroke-width="2"/><text x="1685" y="855" fill="#9fb6c8" font-size="24" font-family="Inter,Arial,sans-serif">Possible geometry only after:</text><text x="1685" y="910" fill="#edf5fb" font-size="24" font-family="Inter,Arial,sans-serif">• state variables are defined</text><text x="1685" y="960" fill="#edf5fb" font-size="24" font-family="Inter,Arial,sans-serif">• admissible constraints are explicit</text><text x="1685" y="1010" fill="#edf5fb" font-size="24" font-family="Inter,Arial,sans-serif">• metric meaning is justified</text><text x="1685" y="1060" fill="#edf5fb" font-size="24" font-family="Inter,Arial,sans-serif">• numerical implementation is verified</text><text x="1685" y="1140" fill="#4ec9b0" font-size="23" font-family="Inter,Arial,sans-serif">Until then: research hypothesis, not theorem.</text></g>
</svg>
