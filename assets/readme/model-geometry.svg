<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" role="img" aria-labelledby="t d">
<title id="t">P-W-T-SW model geometry</title>
<desc id="d">Adaptive light and dark visual showing coupled infrastructure dynamics, synthetic observation, inverse estimation, uncertainty ensemble and viability boundary.</desc>
<style>
:root{--bg:#fff;--panel:#f8fafc;--panel2:#f1f5f9;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--grid:#e2e8f0;--state:#1d4ed8;--viable:#047857;--iface:#7e22ce;--unc:#b45309;--haz:#b91c1c;--teal:#0f766e}
@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--panel2:#12243a;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--grid:#28445f;--state:#60a5fa;--viable:#34d399;--iface:#c084fc;--unc:#fbbf24;--haz:#fb7185;--teal:#5eead4}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.panel2{fill:var(--panel2);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.grid{stroke:var(--grid);fill:none}.state{stroke:var(--state);fill:none}.viable{stroke:var(--viable);fill:none}.iface{stroke:var(--iface);fill:none}.unc{stroke:var(--unc);fill:none}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--state)"/></marker></defs>
<rect class="bg" width="1600" height="780" rx="28"/><g class="grid" opacity=".38"><path d="M0 78H1600M0 156H1600M0 234H1600M0 312H1600M0 390H1600M0 468H1600M0 546H1600M0 624H1600M0 702H1600"/><path d="M160 0V780M320 0V780M480 0V780M640 0V780M800 0V780M960 0V780M1120 0V780M1280 0V780M1440 0V780"/></g>
<text x="66" y="72" class="fg" font-size="31" font-weight="800">COUPLED MODEL → INVERSE PROBLEM → UQ → VIABILITY</text><text x="66" y="104" class="muted" font-size="16">browser demonstrator · explicit epistemic boundary · no field-calibration claim</text>
<rect x="66" y="145" width="350" height="245" rx="20" class="panel"/><text x="92" y="182" fill="var(--state)" font-size="20" font-weight="700">Coupled dynamics</text><text x="92" y="217" class="fg math" font-size="17">ẋᵢ = rᵢ(1−xᵢ)+bᵢu(1−xᵢ)</text><text x="92" y="244" class="fg math" font-size="17">−hᵢ(t)xᵢ−Σⱼcᵢⱼxᵢ(1−xⱼ)</text><g transform="translate(110 285)"><line x1="35" y1="35" x2="115" y2="15" stroke="var(--state)" stroke-width="4"/><line x1="115" y1="15" x2="190" y2="55" stroke="var(--viable)" stroke-width="4"/><line x1="35" y1="35" x2="190" y2="55" stroke="var(--unc)" stroke-width="3" stroke-dasharray="7 6"/><line x1="35" y1="35" x2="118" y2="95" stroke="var(--iface)" stroke-width="4"/><line x1="118" y1="95" x2="190" y2="55" stroke="var(--haz)" stroke-width="4"/><g fill="var(--panel2)" stroke-width="3"><circle cx="35" cy="35" r="23" stroke="var(--state)"/><circle cx="115" cy="15" r="23" stroke="var(--viable)"/><circle cx="190" cy="55" r="23" stroke="var(--unc)"/><circle cx="118" cy="95" r="23" stroke="var(--iface)"/></g><g class="fg" font-size="14" font-weight="700"><text x="35" y="40" text-anchor="middle">P</text><text x="115" y="20" text-anchor="middle">W</text><text x="190" y="60" text-anchor="middle">T</text><text x="118" y="100" text-anchor="middle">SW</text></g></g>
<path d="M416 268H485" class="state" stroke-width="3" marker-end="url(#a)"/>
<rect x="485" y="145" width="350" height="245" rx="20" class="panel"/><text x="511" y="182" fill="var(--state)" font-size="20" font-weight="700">Synthetic observation + inverse</text><text x="511" y="217" class="fg math" font-size="17">yₖ = S(tₖ; α*) + εₖ</text><text x="511" y="244" class="fg math" font-size="17">α̂ = arg min Σₖ[yₖ−S(tₖ;α)]²</text><path d="M520 337C560 286 605 352 650 304S735 300 802 335" class="viable" stroke-width="4"/><g fill="var(--unc)"><circle cx="548" cy="316" r="5"/><circle cx="590" cy="337" r="5"/><circle cx="636" cy="311" r="5"/><circle cx="686" cy="300" r="5"/><circle cx="748" cy="316" r="5"/></g>
<path d="M835 268H904" class="state" stroke-width="3" marker-end="url(#a)"/>
<rect x="904" y="145" width="300" height="245" rx="20" class="panel"/><text x="930" y="182" fill="var(--state)" font-size="20" font-weight="700">Seeded UQ</text><text x="930" y="217" class="fg math" font-size="17">θ⁽ⁿ⁾ ~ p(θ)</text><text x="930" y="244" class="fg math" font-size="17">P̂f=N⁻¹Σ1[min S⁽ⁿ⁾&lt;Smin]</text><path d="M940 340C980 286 1034 275 1080 301C1125 327 1160 346 1180 337" stroke="var(--state)" stroke-opacity=".20" stroke-width="22" fill="none"/><path d="M940 335C980 280 1030 275 1080 296C1123 314 1155 341 1180 332" class="state" stroke-width="3"/>
<path d="M1204 268H1270" class="state" stroke-width="3" marker-end="url(#a)"/>
<rect x="1270" y="145" width="264" height="245" rx="20" class="panel"/><text x="1296" y="182" fill="var(--state)" font-size="20" font-weight="700">Viability</text><text x="1296" y="217" class="fg math" font-size="16">mV(t)=minᵢ[xᵢ−x̲ᵢ]</text><ellipse cx="1401" cy="315" rx="98" ry="48" fill="var(--viable)" fill-opacity=".10" stroke="var(--viable)" stroke-width="3"/><ellipse cx="1401" cy="315" rx="59" ry="27" fill="var(--state)" fill-opacity=".08" stroke="var(--state)" stroke-width="2" stroke-dasharray="7 5"/><path d="M1296 345C1330 337 1354 310 1380 320C1410 330 1430 288 1502 302" class="unc" stroke-width="4" marker-end="url(#a)"/>
<rect x="66" y="440" width="1468" height="245" rx="22" class="panel2"/><text x="94" y="479" fill="var(--state)" font-size="20" font-weight="700">Runtime mathematics and verification lattice</text><g font-size="14" font-weight="700"><rect x="95" y="525" width="180" height="50" rx="12" fill="var(--state)" fill-opacity=".13" stroke="var(--state)"/><text x="185" y="556" text-anchor="middle" class="fg">RK4 integrator</text><rect x="310" y="525" width="180" height="50" rx="12" fill="var(--viable)" fill-opacity=".12" stroke="var(--viable)"/><text x="400" y="556" text-anchor="middle" class="fg">threshold crossing</text><rect x="525" y="525" width="180" height="50" rx="12" fill="var(--iface)" fill-opacity=".12" stroke="var(--iface)"/><text x="615" y="556" text-anchor="middle" class="fg">inverse recovery</text><rect x="740" y="525" width="180" height="50" rx="12" fill="var(--unc)" fill-opacity=".12" stroke="var(--unc)"/><text x="830" y="556" text-anchor="middle" class="fg">seed reproducibility</text><rect x="955" y="525" width="180" height="50" rx="12" fill="var(--haz)" fill-opacity=".10" stroke="var(--haz)"/><text x="1045" y="556" text-anchor="middle" class="fg">state bounds</text><rect x="1170" y="525" width="180" height="50" rx="12" class="panel"/><text x="1260" y="556" text-anchor="middle" class="fg">production audit</text><rect x="1385" y="525" width="120" height="50" rx="12" class="panel"/><text x="1445" y="556" text-anchor="middle" class="fg">CI</text></g><path d="M275 550H310M490 550H525M705 550H740M920 550H955M1135 550H1170M1350 550H1385" class="state" stroke-width="2" marker-end="url(#a)"/><text x="95" y="627" class="muted" font-size="14">Tests verify implementation properties. They do not transform an illustrative model into a calibrated field prediction.</text><text x="95" y="654" class="muted" font-size="13">Theme changes presentation only; model equations, synthetic status and validation boundaries remain invariant.</text>
</svg>