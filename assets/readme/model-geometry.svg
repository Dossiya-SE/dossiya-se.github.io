<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="t d"><title id="t">P-W-T-SW model geometry</title><desc id="d">Visual showing coupled infrastructure dynamics, synthetic observation, inverse estimation, uncertainty ensemble and viability boundary.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#06111d"/><stop offset="1" stop-color="#0b243b"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#7dd3fc"/></marker><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#22506f" stroke-opacity=".25"/></pattern></defs><rect width="1600" height="780" rx="28" fill="url(#bg)"/><rect x="24" y="24" width="1552" height="732" rx="24" fill="url(#grid)" stroke="#1e5575"/><g font-family="Inter,Segoe UI,Arial"><text x="66" y="72" fill="#f0fbff" font-size="31" font-weight="800">COUPLED MODEL → INVERSE PROBLEM → UQ → VIABILITY</text><text x="66" y="104" fill="#9bc9e1" font-size="16">browser demonstrator · explicit epistemic boundary · no field-calibration claim</text>
